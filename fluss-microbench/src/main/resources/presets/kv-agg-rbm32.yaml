meta:
  name: kv-agg-rbm32
  description: "KV table RBM32 – bitmap OR expansion + compaction stress"

client:
  config:
    client.writer.buffer.memory-size: "512mb"
    client.writer.batch-size: "256kb"
    client.writer.max-inflight-requests-per-bucket: "5"
    client.lookup.max-inflight-requests: "128"

table:
  name: rbm_perf
  columns:
    - name: user_id
      type: BIGINT
    - name: visitors
      type: BYTES
      agg: RBM32
  primary-key: [user_id]
  merge-engine: AGGREGATION
  buckets: 128

data:
  seed: 42
  generators:
    user_id:
      type: sequential
      start: 0
      end: 1000000
    visitors:
      type: roaring-bitmap-32
      size: 50
      range: [0, 500000]
      distribution: uniform
      overlap: 0.3

workload:
  - phase: write
    records: 4000000
    threads: 32
  - phase: lookup
    warmup: 10000000
    duration: 60s
    threads: 4
    key-range: [0, 1000000]
  - phase: mixed
    warmup: 500000
    duration: 60s
    threads: 32
    mix:
      write: 60
      lookup: 40
  - phase: scan
    warmup: 100
    duration: 60s
    threads: 2
