meta:
  name: kv-agg-mixed
  description: "KV table mixed write/lookup – SUM/MAX/MIN aggregation contention"

client:
  config:
    client.writer.buffer.memory-size: "512mb"
    client.writer.batch-size: "256kb"
    client.writer.max-inflight-requests-per-bucket: "5"
    client.lookup.max-inflight-requests: "128"

table:
  name: mixed_agg
  columns:
    - name: user_id
      type: BIGINT
    - name: total_amount
      type: DOUBLE
      agg: SUM
    - name: max_score
      type: INT
      agg: MAX
    - name: min_score
      type: INT
      agg: MIN
    - name: is_active
      type: BOOLEAN
      agg: BOOL_OR
  primary-key: [user_id]
  merge-engine: AGGREGATION
  buckets: 128

data:
  seed: 42
  generators:
    user_id:
      type: sequential
      start: 0
      end: 1000000
    total_amount:
      type: random-double
      min: 0.01
      max: 9999.99
    max_score:
      type: random-int
      min: 0
      max: 100
    min_score:
      type: random-int
      min: 0
      max: 100
    is_active:
      type: random-boolean
      true-ratio: 0.7

workload:
  - phase: write
    warmup: 500000
    duration: 7m
    threads: 32
  - phase: lookup
    warmup: 10000
    duration: 2m
    threads: 4
    key-range: [0, 1000000]
  - phase: mixed
    warmup: 100000
    duration: 2m
    threads: 32
    mix:
      write: 50
      lookup: 50
