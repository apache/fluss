meta:
  name: kv-upsert-get
  description: "KV table upsert + point get – pure RocksDB write/compaction stress"

client:
  config:
    client.writer.buffer.memory-size: "512mb"
    client.writer.batch-size: "2mb"
    client.writer.max-inflight-requests-per-bucket: "5"
    client.lookup.max-inflight-requests: "128"

table:
  name: kv_upsert
  columns:
    - name: user_id
      type: BIGINT
    - name: name
      type: STRING
    - name: balance
      type: DOUBLE
    - name: updated_at
      type: BIGINT
  primary-key: [user_id]
  buckets: 128

data:
  seed: 42
  generators:
    user_id:
      type: sequential
      start: 0
      end: 5000000
    name:
      type: random-string
      length: 32
    balance:
      type: random-double
      min: 0.0
      max: 100000.0
    updated_at:
      type: timestamp-now

workload:
  - phase: write-bulk
    warmup: 500000
    records: 10000000
    threads: 32
  - phase: write-sustained
    warmup: 30s
    duration: 2m
    threads: 32
  - phase: lookup
    warmup: 2000
    duration: 2m
    threads: 4
    key-range: [0, 5000000]
  - phase: mixed
    duration: 2m
    threads: 32
    mix:
      write: 50
      lookup: 50
