name: Rust Build and Tests

on:
  push:
    branches:
      - main
    paths:
      - 'fluss-rust/crates/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/rust-build-and-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fluss-rust/crates/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rpc/src/main/proto/**'
      - '.github/workflows/rust-build-and-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fluss-rust

jobs:
  build-and-unit-test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust

      - name: Build
        run: cargo build --workspace --all-targets --exclude fluss_python --exclude fluss-cpp --exclude fluss_nif

      - name: Unit Test
        run: cargo test --all-targets --workspace --exclude fluss_python --exclude fluss-cpp --exclude fluss_nif
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

  proto-up-to-date:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          # Pinned: this job compares regenerated output byte-for-byte.
          version: "27.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust

      - name: Regenerate protobuf code
        run: ./crates/fluss/regen.sh

      - name: Verify the checked-in code is up to date
        id: verify
        run: |
          git diff --exit-code || {
            echo "::error::Checked-in protobuf code is out of date with fluss-rpc/src/main/proto/FlussApi.proto. Run fluss-rust/crates/fluss/regen.sh and commit the result, or commit the files from this job's regenerated-proto artifact."
            exit 1
          }

      - name: Upload regenerated files
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-proto
          path: |
            fluss-rust/crates/fluss/src/proto/fluss.rs
            fluss-rust/crates/fluss/proto/FlussApi.proto
