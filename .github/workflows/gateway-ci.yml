# Gateway CI also follows the native Rust client sources used by its configuration adapter.
# `uses:` step inputs are relative to the repository root.
name: Gateway CI

on:
  push:
    branches:
      - main
      - release-**
      - ci-**
    paths:
      - 'fluss-gateway/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/crates/fluss/**'
      - 'fluss-rpc/src/main/proto/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'docker/fluss-gateway/**'
      - '.dockerignore'
      - 'tools/releasing/create_gateway_release.sh'
      - 'tools/releasing/update_branch_version.sh'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches:
      - main
      - release-**
    paths:
      - 'fluss-gateway/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/crates/fluss/**'
      - 'fluss-rpc/src/main/proto/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'docker/fluss-gateway/**'
      - '.dockerignore'
      - 'tools/releasing/create_gateway_release.sh'
      - 'tools/releasing/update_branch_version.sh'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fluss-gateway

jobs:
  build-and-unit-test:
    name: "Gateway Build and Tests"
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-gateway

      # Without `--locked` Cargo rewrites a stale lockfile in the CI workspace, and the run would
      # validate a dependency graph the repository does not contain.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Unit and Integration Tests
        run: cargo test --locked --all-targets
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

      - name: OpenAPI drift check
        run: |
          cargo test --locked --lib protocol::rest::openapi::tests::export_checked_in_document -- --ignored --exact
          git diff --exit-code openapi.yaml

      - name: OpenAPI external validation
        run: npx --yes @redocly/cli@1 lint openapi.yaml

  msrv:
    name: "Gateway MSRV (1.88)"
    # rust-toolchain.toml floats to stable, so a plain build never catches features newer
    # than the declared rust-version; `+toolchain` overrides the file here.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-gateway

      - name: Check on the declared MSRV
        run: cargo +1.88.0 check --locked --all-targets

  check-license-and-formatting:
    name: "Gateway License and Formatting Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check License Header
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        with:
          config: fluss-gateway/.licenserc.yaml

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency licenses (Apache-compatible)
        run: cargo deny --locked check licenses

      - name: Check banned dependencies (HTTP/2 stack stays out)
        run: cargo deny --locked check bans

      # The inventory ships with the source release, so a stale one is worse than none.
      - name: Dependency inventory drift check
        run: |
          cargo deny --locked list -f tsv -t 0.6 | sed 's/[[:space:]]*$//' > DEPENDENCIES.rust.tsv
          git diff --exit-code DEPENDENCIES.rust.tsv

      - name: Binary LICENSE and NOTICE drift check
        run: python3 scripts/generate_binary_license.py --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-gateway

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rustdoc
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check distribution shell scripts
        run: |
          bash -n bin/fluss-gateway.sh
          bash -n ../docker/fluss-gateway/build.sh
          bash -n ../docker/fluss-gateway/prepare_build.sh
          bash -n ../docker/fluss-gateway/smoke-test.sh
          bash -n ../tools/releasing/create_gateway_release.sh
          bash -n ../tools/releasing/update_branch_version.sh

  container-smoke-test:
    name: "Gateway Distribution and Container (${{ matrix.arch }})"
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6

      # The ASF enterprise only permits third-party actions that its allowlist pins to
      # an exact commit, so a moving tag such as @v3 fails the whole run before any job
      # starts. This commit is the revision other ASF projects already build images with.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and smoke test the distribution and image
        env:
          FLUSS_VERSION: smoke
          GATEWAY_ARCH: ${{ matrix.arch }}
          GATEWAY_BUILD_CACHE_FROM: type=gha,scope=fluss-gateway-${{ matrix.arch }}
          GATEWAY_BUILD_CACHE_TO: type=gha,mode=max,scope=fluss-gateway-${{ matrix.arch }}
          GATEWAY_IMAGE: fluss-gateway:smoke-${{ matrix.arch }}
          RUN_SMOKE: "true"
          VCS_REF: ${{ github.sha }}
        run: docker/fluss-gateway/build.sh
