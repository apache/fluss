name: DevKit Smoke

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'devkit/**'
      - 'fluss-dist/**'
      - 'fluss-flink/fluss-flink-1.20/**'
      - 'fluss-flink/fluss-flink-common/**'
      - 'pom.xml'
      - '.github/workflows/devkit-smoke.yaml'
  push:
    branches:
      - main
      - release-**
    paths:
      - 'devkit/**'
      - 'fluss-dist/**'
      - 'fluss-flink/fluss-flink-1.20/**'
      - 'fluss-flink/fluss-flink-common/**'
      - 'pom.xml'
      - '.github/workflows/devkit-smoke.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.40.0

      - name: Run core and Paimon smoke tests
        working-directory: devkit
        run: |
          set -euo pipefail
          trap 'just clean >/dev/null 2>&1 || true' EXIT
          just build paimon
          just build gateway
          just up gateway
          curl --fail --silent --show-error http://localhost:8080/v1/clusters/default/databases
          just down
          just up paimon
          just run-sql examples/lake/paimon/setup.sql
          just run-sql examples/lake/paimon/union-read.sql
          just run-sql examples/lake/paimon/lake-only-read.sql
