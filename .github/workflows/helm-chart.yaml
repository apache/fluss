name: "Helm Chart"

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yaml'
  push:
    branches: [main, release-*, ci-*]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-chart.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-helm-chart:
    name: "Helm Lint and Unittest"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Set up Helm"
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: "Lint Helm chart"
        run: helm lint ./helm

      # Helm 4 verifies plugin signatures by default, and helm-unittest is not signed.
      - name: "Run helm-unittest"
        run: |
          helm plugin install --verify=false --version v1.2.1 https://github.com/helm-unittest/helm-unittest
          helm unittest ./helm
