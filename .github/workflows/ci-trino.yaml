name: Trino Connector CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - release-**
    paths:
      - 'fluss-trino/**'
      - 'tools/maven/checkstyle.xml'
      - 'tools/maven/suppressions.xml'
      - '.github/workflows/ci-trino.yaml'

  pull_request:
    paths:
      - 'fluss-trino/**'
      - 'tools/maven/checkstyle.xml'
      - 'tools/maven/suppressions.xml'
      - '.github/workflows/ci-trino.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: "Trino Connector / Java 25"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        working-directory: fluss-trino
        run: ./mvnw -B clean verify
