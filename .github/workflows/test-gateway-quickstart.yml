name: Test Gateway Lakehouse Quickstart

on:
  push:
    branches:
      - issue-4221-http-gateway-quickstart
  workflow_dispatch:

jobs:
  gateway-lakehouse-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: temurin

      - name: Show versions
        run: |
          docker version
          docker compose version
          java -version

      # ------------------------------------------------------------
      # Resolve the versions used by the documentation.
      # ------------------------------------------------------------
      - name: Resolve quickstart versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("website/fluss-versions.json").read_text())
          next_version = next(v for v in data if v["versionName"] == "next")

          fluss_version = next_version["fullVersion"]
          fluss_docker_version = next_version["dockerVersion"]
          paimon_version = next_version["paimonVersion"]
          flink_docker_version = "1.20-1.0-SNAPSHOT"

          print(f"FLUSS_VERSION={fluss_version}")
          print(f"FLUSS_DOCKER_VERSION={fluss_docker_version}")
          print(f"PAIMON_VERSION={paimon_version}")
          print(f"FLINK_DOCKER_VERSION={flink_docker_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fluss_version={fluss_version}\n")
              f.write(f"fluss_docker_version={fluss_docker_version}\n")
              f.write(f"paimon_version={paimon_version}\n")
              f.write(f"flink_docker_version={flink_docker_version}\n")
          PY

      # ------------------------------------------------------------
      # Extract the Docker Compose example from the quickstart and
      # substitute the documented version placeholders.
      # ------------------------------------------------------------
      - name: Prepare Compose file from documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/lib

          curl -fL --retry 3 --retry-delay 2 \
            "https://repo.maven.apache.org/maven2/org/apache/paimon/paimon-s3/${PAIMON_VERSION}/paimon-s3-${PAIMON_VERSION}.jar" \
            -o "/tmp/lib/paimon-s3-${PAIMON_VERSION}.jar"

          test -s "/tmp/lib/paimon-s3-${PAIMON_VERSION}.jar"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          md = Path("website/docs/quickstart/gateway-lakehouse.md").read_text()
          blocks = re.findall(r"```yaml\s*\n(.*?)```", md, re.S)
          if not blocks:
              raise SystemExit("No YAML fenced block found in quickstart")

          compose = blocks[0]
          substitutions = {
              "$FLUSS_VERSION$": os.environ["FLUSS_VERSION"],
              "$FLUSS_DOCKER_VERSION$": os.environ["FLUSS_DOCKER_VERSION"],
              "$PAIMON_VERSION$": os.environ["PAIMON_VERSION"],
              "$FLUSS_QUICKSTART_FLINK_DOCKER_VERSION$": os.environ["FLINK_DOCKER_VERSION"],
          }
          for old, new in substitutions.items():
              compose = compose.replace(old, new)

          unresolved = [token for token in substitutions if token in compose]
          if unresolved:
              raise SystemExit("Unresolved placeholders: " + ", ".join(unresolved))

          Path("/tmp/gateway-lakehouse-compose.yaml").write_text(compose)
          print(compose)
          PY

          echo "---- docker compose config ----"
          docker compose -f /tmp/gateway-lakehouse-compose.yaml config
        env:
          FLUSS_VERSION: ${{ steps.versions.outputs.fluss_version }}
          FLUSS_DOCKER_VERSION: ${{ steps.versions.outputs.fluss_docker_version }}
          PAIMON_VERSION: ${{ steps.versions.outputs.paimon_version }}
          FLINK_DOCKER_VERSION: ${{ steps.versions.outputs.flink_docker_version }}

      # ------------------------------------------------------------
      # Build Apache Fluss from source.
      #
      # docker/fluss/Dockerfile explicitly COPYs build-target/,
      # which is generated by the Maven build.
      # ------------------------------------------------------------
      - name: Build Fluss distribution
        shell: bash
        run: |
          set -euo pipefail

          ./mvnw clean install -DskipTests -T 1C

          test -d build-target
          test -f build-target/bin/coordinator-server.sh
          test -f build-target/bin/tablet-server.sh

          echo "---- build-target ----"
          du -sh build-target

      - name: Prepare Fluss Docker build context
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/fluss-docker-context"
          mkdir -p "$RUNNER_TEMP/fluss-docker-context"

          cp docker/fluss/Dockerfile \
            "$RUNNER_TEMP/fluss-docker-context/Dockerfile"

          cp docker/fluss/docker-entrypoint.sh \
            "$RUNNER_TEMP/fluss-docker-context/docker-entrypoint.sh"

          cp -a build-target \
            "$RUNNER_TEMP/fluss-docker-context/build-target"

          echo "---- Docker context ----"
          find "$RUNNER_TEMP/fluss-docker-context" -maxdepth 2 -type f | head -50
          du -sh "$RUNNER_TEMP/fluss-docker-context/build-target"

          test -f "$RUNNER_TEMP/fluss-docker-context/Dockerfile"
          test -f "$RUNNER_TEMP/fluss-docker-context/docker-entrypoint.sh"
          test -f "$RUNNER_TEMP/fluss-docker-context/build-target/bin/coordinator-server.sh"
          test -f "$RUNNER_TEMP/fluss-docker-context/build-target/bin/tablet-server.sh"

      - name: Build Fluss Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "Building from: $RUNNER_TEMP/fluss-docker-context"

          docker build --no-cache \
            -t apache/fluss:${{ steps.versions.outputs.fluss_docker_version }} \
            "$RUNNER_TEMP/fluss-docker-context"

          docker image inspect \
            apache/fluss:${{ steps.versions.outputs.fluss_docker_version }}

      - name: Prepare quickstart-flink build
        shell: bash
        run: |
          set -euo pipefail

          if [ -f docker/quickstart-flink/prepare_build.sh ]; then
            docker/quickstart-flink/prepare_build.sh
          else
            echo "quickstart-flink/prepare_build.sh missing; fetching current main helper."
            git fetch origin main --depth=1
            git show origin/main:docker/quickstart-flink/prepare_build.sh > docker/quickstart-flink/prepare_build.sh
            chmod +x docker/quickstart-flink/prepare_build.sh
            docker/quickstart-flink/prepare_build.sh
            rm -f docker/quickstart-flink/prepare_build.sh
          fi

          test -d docker/quickstart-flink/paimon
          test -d docker/quickstart-flink/opt
          test -d docker/quickstart-flink/lib

      - name: Build quickstart-flink Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t apache/fluss-quickstart-flink:${{ steps.versions.outputs.flink_docker_version }} \
            docker/quickstart-flink

          docker image inspect apache/fluss-quickstart-flink:${{ steps.versions.outputs.flink_docker_version }}

      # ------------------------------------------------------------
      # Build Gateway image.      # ------------------------------------------------------------
      # Build Gateway image.
      # ------------------------------------------------------------
      - name: Build Gateway Docker image
        run: |
          docker/fluss-gateway/build.sh

          docker image inspect fluss-gateway:dev

      # ------------------------------------------------------------
      # Start stack.
      # ------------------------------------------------------------
      - name: Start Compose stack
        run: |
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            up -d

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            ps

      # ------------------------------------------------------------
      # Wait for the core infrastructure.
      # ------------------------------------------------------------
      - name: Wait for core containers
        shell: bash
        run: |
          set -e

          compose() {
            docker compose \
              -f /tmp/gateway-lakehouse-compose.yaml \
              "$@"
          }

          found=false
          for i in {1..60}; do
            if compose ps --status running | grep -q coordinator-server; then
              echo "Coordinator is running"
              found=true
              break
            fi

            echo "Waiting for coordinator... ($i/60)"
            sleep 5
          done

          if [ "$found" != true ]; then
            echo "Timed out waiting for coordinator-server" >&2
            compose ps
            exit 1
          fi

          compose ps

      # ------------------------------------------------------------
      # Gateway health/readiness.
      # ------------------------------------------------------------
      - name: Wait for Gateway
        shell: bash
        run: |
          set -e

          health_ready=false
          for i in {1..60}; do
            if curl -sS --fail http://localhost:8080/health >/tmp/gateway-health.json 2>/tmp/gateway-health.err; then
              echo "Gateway /health is ready"
              cat /tmp/gateway-health.json
              health_ready=true
              break
            fi

            echo "Waiting for Gateway /health... ($i/60)"
            sleep 2
          done

          if [ "$health_ready" != true ]; then
            echo "Timed out waiting for Gateway /health" >&2
            cat /tmp/gateway-health.err || true
            exit 1
          fi

          curl -sS --fail-with-body http://localhost:8080/health

          gateway_ready=false
          for i in {1..60}; do
            if curl -sS --fail http://localhost:8080/ready >/tmp/gateway-ready.json 2>/tmp/gateway-ready.err; then
              echo "Gateway /ready is ready"
              cat /tmp/gateway-ready.json
              gateway_ready=true
              break
            fi

            echo "Waiting for Gateway /ready... ($i/60)"
            sleep 2
          done

          if [ "$gateway_ready" != true ]; then
            echo "Timed out waiting for Gateway /ready" >&2
            cat /tmp/gateway-ready.err || true
            exit 1
          fi

          curl -sS --fail-with-body http://localhost:8080/ready

      # ------------------------------------------------------------
      # Create database through Gateway REST API.
      # ------------------------------------------------------------
      - name: Create database
        shell: bash
        run: |
          set -e

          response="$(
            curl -sS --fail-with-body \
              -X POST \
              http://localhost:8080/databases \
              -H 'Content-Type: application/json' \
              -d '{
                "database_name": "gateway_demo"
              }'
          )"

          echo "$response"

      # ------------------------------------------------------------
      # Create lake-enabled table through Gateway REST API.
      # ------------------------------------------------------------
      - name: Create lake-enabled table
        shell: bash
        run: |
          set -e

          cat >/tmp/create-table.json <<'JSON'
          {
            "table_name": "orders",
            "columns": [
              {
                "name": "order_id",
                "data_type": {
                  "type": "INTEGER"
                },
                "nullable": false
              },
              {
                "name": "customer",
                "data_type": {
                  "type": "STRING"
                },
                "nullable": true
              },
              {
                "name": "amount_cents",
                "data_type": {
                  "type": "BIGINT"
                },
                "nullable": true
              },
              {
                "name": "status",
                "data_type": {
                  "type": "STRING"
                },
                "nullable": true
              }
            ],
            "primary_key": [
              "order_id"
            ],
            "distribution": {
              "bucket_count": 1,
              "bucket_keys": [
                "order_id"
              ]
            },
            "configs": {
              "table.datalake.enabled": "true",
              "table.datalake.freshness": "30s"
            }
          }
          JSON

          response="$(
            curl -sS --fail-with-body \
              -X POST \
              http://localhost:8080/databases/gateway_demo/tables \
              -H 'Content-Type: application/json' \
              --data @/tmp/create-table.json
          )"

          echo "$response"

      # ------------------------------------------------------------
      # Write records through Gateway.
      # ------------------------------------------------------------
      - name: Write initial records
        shell: bash
        run: |
          set -e

          cat >/tmp/write-records.json <<'JSON'
          {
            "entries": [
              {
                "upsert": {
                  "order_id": 1,
                  "customer": "Alice",
                  "amount_cents": 12500,
                  "status": "CREATED"
                }
              },
              {
                "upsert": {
                  "order_id": 2,
                  "customer": "Bob",
                  "amount_cents": 8900,
                  "status": "PAID"
                }
              },
              {
                "upsert": {
                  "order_id": 3,
                  "customer": "Carol",
                  "amount_cents": 4200,
                  "status": "SHIPPED"
                }
              }
            ]
          }
          JSON

          response="$(
            curl -sS --fail-with-body \
              -X POST \
              http://localhost:8080/databases/gateway_demo/tables/orders/records \
              -H 'Content-Type: application/json' \
              --data @/tmp/write-records.json
          )"

          echo "$response"

          echo "$response" | grep -q "upsert"
          echo "$response" | grep -q "order_id"

      # ------------------------------------------------------------
      # Wait for Flink.
      # ------------------------------------------------------------
      - name: Wait for Flink
        shell: bash
        run: |
          set -e

          for i in {1..60}; do
            if docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                exec -T jobmanager \
                /opt/flink/bin/flink list >/tmp/flink-list.out 2>/tmp/flink-list.err; then
              echo "Flink is ready"
              cat /tmp/flink-list.out
              break
            fi

            echo "Waiting for Flink... ($i/60)"
            sleep 3
          done

      # ------------------------------------------------------------
      # Start Lakehouse Tiering Service.
      # ------------------------------------------------------------
      - name: Start Lakehouse Tiering Service
        shell: bash
        run: |
          set -e

          tiering_jar="$(
            docker compose \
              -f /tmp/gateway-lakehouse-compose.yaml \
              exec -T jobmanager \
              bash -lc 'find /opt/flink/opt -maxdepth 1 -name "fluss-flink-tiering-*.jar" -print -quit'
          )"

          test -n "$tiering_jar"
          echo "Using tiering jar: $tiering_jar"

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            /opt/flink/bin/flink run -d \
              "$tiering_jar" \
              --fluss.bootstrap.servers coordinator-server:9123 \
              --datalake.format paimon \
              --datalake.paimon.metastore filesystem \
              --datalake.paimon.warehouse s3://fluss/paimon \
              --datalake.paimon.s3.endpoint http://rustfs:9000 \
              --datalake.paimon.s3.access.key rustfsadmin \
              --datalake.paimon.s3.secret.key rustfsadmin \
              --datalake.paimon.s3.path.style.access true

          sleep 5

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            exec -T jobmanager \
            /opt/flink/bin/flink list

      # ------------------------------------------------------------
      # Helper script for SQL queries.
      # ------------------------------------------------------------
      - name: Wait for initial lake snapshot
        shell: bash
        run: |
          set -e

          found=false
          for i in {1..60}; do
            output="$(
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T -v /tmp/lib/paimon-s3-${{ steps.versions.outputs.paimon_version }}.jar:/tmp/paimon-s3.jar:ro sql-client \
                bash -lc '
                  cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

                  /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
                  USE CATALOG fluss_catalog;
                  USE gateway_demo;
                  SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

                  SELECT * FROM orders$lake$snapshots;
                  SELECT COUNT(*) FROM orders$lake;
                  SELECT COUNT(*) FROM orders;
                  SQL
                '
            )" || true

            echo "$output"

            if echo "$output" | grep -qE '3.*3|3[[:space:]]*\|[[:space:]]*3'; then
              echo "Lake data is visible"
              found=true
              break
            fi

            echo "Waiting for tiering... ($i/60)"
            sleep 5
          done

          if [ "$found" != true ]; then
            echo "Timed out waiting for the first lake snapshot / 3 lake rows" >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # Validate snapshot metadata, lake data and Union Read.
      # ------------------------------------------------------------
      - name: Validate initial lakehouse state
        shell: bash
        run: |
          set -e

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T -v /tmp/lib/paimon-s3-${{ steps.versions.outputs.paimon_version }}.jar:/tmp/paimon-s3.jar:ro sql-client \
            bash -lc '
              cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

              /opt/flink/bin/sql-client.sh <<'"'"'"'"'SQL'"'"'
              USE CATALOG fluss_catalog;
              USE gateway_demo;
              SET '"'"'"'"'execution.runtime-mode'"'"'"'='"'"'"'batch'"'"'"';

              SELECT * FROM orders$lake$snapshots;

              SELECT COUNT(*) AS lake_count
              FROM orders$lake;

              SELECT COUNT(*) AS union_count
              FROM orders;

              SELECT *
              FROM orders
              ORDER BY order_id;

              SQL
            '

      # ------------------------------------------------------------
      # Fresh Gateway write after tiering has begun.
      # ------------------------------------------------------------
      - name: Write fresh record through Gateway
        shell: bash
        run: |
          set -e

          cat >/tmp/write-order-4.json <<'JSON'
          {
            "entries": [
              {
                "upsert": {
                  "order_id": 4,
                  "customer": "Dave",
                  "amount_cents": 7777,
                  "status": "CREATED"
                }
              }
            ]
          }
          JSON

          response="$(
            curl -sS --fail-with-body \
              -X POST \
              http://localhost:8080/databases/gateway_demo/tables/orders/records \
              -H 'Content-Type: application/json' \
              --data @/tmp/write-order-4.json
          )"

          echo "$response"

          echo "$response" | grep -q "upsert"
          echo "$response" | grep -q "order_id"

      # ------------------------------------------------------------
      # Union Read should see the hot record before lake tiering.
      # ------------------------------------------------------------
      - name: Validate Union Read sees fresh Gateway write
        shell: bash
        run: |
          set -e

          found=false
          for i in {1..30}; do
            output="$(
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T -v /tmp/lib/paimon-s3-${{ steps.versions.outputs.paimon_version }}.jar:/tmp/paimon-s3.jar:ro sql-client \
                bash -lc '
                  cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

                  /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
                  USE CATALOG fluss_catalog;
                  USE gateway_demo;
                  SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

                  SELECT COUNT(*) AS union_count
                  FROM orders;

                  SELECT *
                  FROM orders
                  WHERE order_id = 4;
                  SQL
                '
            )" || true

            echo "$output"

            if echo "$output" | grep -q "4"; then
              echo "Union Read sees order 4"
              found=true
              break
            fi

            echo "Waiting for fresh Union Read result... ($i/30)"
            sleep 3
          done

          if [ "$found" != true ]; then
            echo "Timed out waiting for Union Read to see order 4" >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # Wait until the fresh record reaches the lake too.
      # ------------------------------------------------------------
      - name: Validate fresh record is eventually tiered
        shell: bash
        run: |
          set -e

          found=false
          for i in {1..60}; do
            output="$(
              docker compose \
                -f /tmp/gateway-lakehouse-compose.yaml \
                run --rm -T -v /tmp/lib/paimon-s3-${{ steps.versions.outputs.paimon_version }}.jar:/tmp/paimon-s3.jar:ro sql-client \
                bash -lc '
                  cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

                  /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
                  USE CATALOG fluss_catalog;
                  USE gateway_demo;
                  SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

                  SELECT COUNT(*) AS lake_count
                  FROM orders$lake;
                  SQL
                '
            )" || true

            echo "$output"

            if echo "$output" | grep -q "4"; then
              echo "Four records are now tiered into the lake"
              found=true
              break
            fi

            echo "Waiting for lake tiering... ($i/60)"
            sleep 5
          done

          if [ "$found" != true ]; then
            echo "Timed out waiting for the fourth record to reach the lake" >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # Final validation.
      # ------------------------------------------------------------
      - name: Final end-to-end validation
        shell: bash
        run: |
          set -e

          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            run --rm -T -v /tmp/lib/paimon-s3-${{ steps.versions.outputs.paimon_version }}.jar:/tmp/paimon-s3.jar:ro sql-client \
            bash -lc '
              cp /tmp/paimon-s3.jar /opt/flink/lib/paimon-s3.jar

              /opt/flink/bin/sql-client.sh <<'"'"'SQL'"'"'
              USE CATALOG fluss_catalog;
              USE gateway_demo;
              SET '"'"'execution.runtime-mode'"'"'='"'"'batch'"'"';

              SELECT COUNT(*) AS snapshot_count
              FROM orders$lake$snapshots;

              SELECT COUNT(*) AS lake_count
              FROM orders$lake;

              SELECT COUNT(*) AS union_count
              FROM orders;

              SELECT *
              FROM orders
              ORDER BY order_id;
              SQL
            '

      # ------------------------------------------------------------
      # Verify Gateway cleanup.
      # ------------------------------------------------------------
      - name: Cleanup through Gateway
        shell: bash
        run: |
          set -e

          curl -sS --fail-with-body \
            -X DELETE \
            http://localhost:8080/databases/gateway_demo/tables/orders

          curl -sS --fail-with-body \
            -X DELETE \
            http://localhost:8080/databases/gateway_demo

      # ------------------------------------------------------------
      # Always collect diagnostics on failure.
      # ------------------------------------------------------------
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          echo "================ docker compose ps ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            ps || true

          echo "================ coordinator logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=200 coordinator-server || true

          echo "================ tablet logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=200 tablet-server || true

          echo "================ gateway logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=300 gateway || true

          echo "================ jobmanager logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=300 jobmanager || true

          echo "================ taskmanager logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=300 taskmanager || true

          echo "================ rustfs logs ================"
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            logs --tail=200 rustfs || true

      # ------------------------------------------------------------
      # Always tear down containers/volumes.
      # ------------------------------------------------------------
      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose \
            -f /tmp/gateway-lakehouse-compose.yaml \
            down -v --remove-orphans