# GitHub emails a failed scheduled run only to whoever last edited its cron
# line, so open an issue instead, or comment on the open one.
name: Nightly Failure Alert

on:
  workflow_run:
    workflows: [Rust Build and Tests, Client Integration, Gateway CI]
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  open-issue:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-slim
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "[build] Nightly run of ${{ github.event.workflow_run.name }} failed"
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$RUN_URL"
          fi
