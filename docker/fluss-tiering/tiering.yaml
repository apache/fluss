# Default configuration of the embedded Fluss lake tiering service.
#
# Keys carrying the fluss., datalake., or lake.tiering. prefix configure the
# tiering service, for example:
#
#   fluss.bootstrap.servers: fluss:9123
#   datalake.format: paimon
#   datalake.paimon.metastore: filesystem
#   datalake.paimon.warehouse: /tmp/paimon
#   fluss.tiering.poll.table.interval: 30 s
#
# All remaining keys configure the embedded Flink runtime, for example:
#
#   parallelism.default: 4
#   taskmanager.numberOfTaskSlots: 4
#   pipeline.name: fluss-lake-tiering
#
# If parallelism.default is unset, the embedded runtime runs the tiering source
# at the machine's CPU core count (Flink's default local parallelism). When
# taskmanager.numberOfTaskSlots is pinned below that, the service fails fast at
# startup. Set both parallelism.default and taskmanager.numberOfTaskSlots
# explicitly to control the parallelism and slot budget.
#
# Values may reference environment variables as ${VAR}. Additional key-value
# pairs can be provided through the FLUSS_TIERING_PROPERTIES environment
# variable, one "key: value" pair per line. The service fails to start until
# fluss.bootstrap.servers and datalake.format are configured.
