services:
  gateway:
    image: ${DEVKIT_GATEWAY_RUNTIME_IMAGE:-debian:bookworm-slim}
    profiles: [gateway]
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    entrypoint: ["/opt/fluss/bin/fluss-gateway"]
    command: ["--config", "/opt/fluss/conf/gateway.yaml"]
    depends_on:
      coordinator-server:
        condition: service_healthy
    environment:
      FLUSS_GATEWAY__REST__LISTEN: 0.0.0.0:8080
      FLUSS_GATEWAY__METRICS__EXPORTER__PROMETHEUS__LISTEN: 0.0.0.0:9095
      FLUSS_GATEWAY__CLUSTER__DEFAULT__BOOTSTRAP__SERVERS: coordinator-server:19123
    volumes:
      - ../devkit/.deps/gateway/debug/fluss-gateway:/opt/fluss/bin/fluss-gateway:ro
      - ../fluss-gateway/conf/gateway.yaml:/opt/fluss/conf/gateway.yaml:ro
    ports:
      - "${GATEWAY_REST_PORT:-8080}:8080"
      - "${GATEWAY_METRICS_PORT:-9095}:9095"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
