services:
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.83
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rustfs-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin; do sleep 2; done
        mc mb --ignore-existing rustfs/fluss
        printf '' | mc pipe rustfs/fluss/hudi/.keep

  coordinator-server:
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  jobmanager:
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

volumes:
  rustfs-data:
