remote.data.dir: s3://fluss/remote-data
s3.endpoint: http://rustfs:9000
s3.access-key: rustfsadmin
s3.secret-key: rustfsadmin
s3.region: us-east-1
s3.path-style-access: true
s3.assumed.role.arn: arn:aws:iam::000000000000:role/rustfsadmin
s3.assumed.role.sts.endpoint: http://rustfs:9000

datalake.enabled: true
datalake.format: hudi
datalake.hudi.mode: dfs
datalake.hudi.catalog.path: s3a://fluss/hudi
datalake.hudi.hadoop.fs.s3a.endpoint: http://rustfs:9000
datalake.hudi.hadoop.fs.s3a.access.key: rustfsadmin
datalake.hudi.hadoop.fs.s3a.secret.key: rustfsadmin
datalake.hudi.hadoop.fs.s3a.path.style.access: true
datalake.hudi.hadoop.fs.s3a.connection.ssl.enabled: false
datalake.hudi.hadoop.fs.s3a.impl.disable.cache: true
datalake.hudi.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
datalake.hudi.hoodie.write.lock.provider: org.apache.hudi.client.transaction.lock.InProcessLockProvider

fluss.tiering.poll.table.interval: 1s
