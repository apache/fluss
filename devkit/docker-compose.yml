name: fluss-devkit

x-fluss-common: &fluss-common
  image: ${FLUSS_DEVKIT_IMAGE:-eclipse-temurin:17-jre-noble}
  init: true
  restart: unless-stopped
  stop_grace_period: 2m
  volumes:
    - ../build-target:/opt/fluss:ro
    - ${FLUSS_DEVKIT_CONFIG:-./profiles/core/server.yaml}:/opt/fluss/conf/server.yaml:ro
    - shared-data:/tmp/fluss
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-tablet-common: &tablet-common
  <<: *fluss-common
  entrypoint: ["/opt/fluss/bin/tablet-server.sh", "start-foreground"]
  depends_on:
    coordinator-server:
      condition: service_healthy
  environment:
    FLUSS_LOG_DIR: /tmp/fluss-logs
    READINESS_TCP_PORT: "9123"
    READINESS_HEALTH_CHECK_TIMEOUT_SECONDS: "180"
  healthcheck:
    test: ["CMD-SHELL", "bash /opt/fluss/bin/readiness-check.sh"]
    interval: 5s
    timeout: 15s
    retries: 36
    start_period: 10s

services:
  # Flink runs as the flink user while Fluss creates this shared volume as root.
  shared-data-init:
    image: ${FLUSS_DEVKIT_IMAGE:-eclipse-temurin:17-jre-noble}
    restart: "no"
    volumes:
      - shared-data:/tmp/fluss
    entrypoint: ["/bin/bash", "-c"]
    command: ["chmod 0777 /tmp/fluss"]

  zookeeper:
    image: zookeeper:3.9.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - zookeeper-data:/data
      - zookeeper-log:/datalog

  coordinator-server:
    <<: *fluss-common
    entrypoint: ["/opt/fluss/bin/coordinator-server.sh", "start-foreground"]
    depends_on:
      shared-data-init:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
    command:
      - -Dzookeeper.address=zookeeper:2181
      - -Dbind.listeners=INTERNAL://coordinator-server:0,CLIENT://coordinator-server:9123,DEVKIT://coordinator-server:19123
      - -Dadvertised.listeners=CLIENT://localhost:${COORDINATOR_PORT:-9123}
      - -Dinternal.listener.name=INTERNAL
      - -Ddefault.replication.factor=${FLUSS_REPLICATION_FACTOR:-1}
      - -Dmetrics.reporters=prometheus
      - -Dmetrics.reporter.prometheus.port=9249
    environment:
      FLUSS_LOG_DIR: /tmp/fluss-logs
      FLUSS_ENV_JAVA_OPTS: -Xms512m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${COORDINATOR_PORT:-9123}:9123"
      - "${COORDINATOR_DEBUG_PORT:-15005}:5005"
      - "${COORDINATOR_METRICS_PORT:-9249}:9249"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/coordinator-server/9123'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  tablet-server-0:
    <<: *tablet-common
    profiles: [single, cluster]
    command:
      - -Dzookeeper.address=zookeeper:2181
      - -Dbind.listeners=INTERNAL://tablet-server-0:0,CLIENT://tablet-server-0:9123,DEVKIT://tablet-server-0:19123
      - -Dadvertised.listeners=CLIENT://localhost:${TABLET_SERVER_0_PORT:-9124}
      - -Dinternal.listener.name=INTERNAL
      - -Dtablet-server.id=0
      - -Dkv.snapshot.interval=10s
      - -Ddata.dir=/tmp/fluss/data/tablet-server-0
      - -Dmetrics.reporters=prometheus
      - -Dmetrics.reporter.prometheus.port=9249
    environment:
      FLUSS_LOG_DIR: /tmp/fluss-logs
      FLUSS_ENV_JAVA_OPTS: -Xms512m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      READINESS_TCP_HOST: tablet-server-0
      READINESS_TCP_PORT: "9123"
      READINESS_HEALTH_CHECK_TIMEOUT_SECONDS: "180"
    ports:
      - "${TABLET_SERVER_0_PORT:-9124}:9123"
      - "${TABLET_SERVER_0_DEBUG_PORT:-15006}:5005"
      - "${TABLET_SERVER_0_METRICS_PORT:-9250}:9249"

  tablet-server-1:
    <<: *tablet-common
    profiles: [cluster]
    command:
      - -Dzookeeper.address=zookeeper:2181
      - -Dbind.listeners=INTERNAL://tablet-server-1:0,CLIENT://tablet-server-1:9123,DEVKIT://tablet-server-1:19123
      - -Dadvertised.listeners=CLIENT://localhost:${TABLET_SERVER_1_PORT:-9125}
      - -Dinternal.listener.name=INTERNAL
      - -Dtablet-server.id=1
      - -Dkv.snapshot.interval=10s
      - -Ddata.dir=/tmp/fluss/data/tablet-server-1
      - -Dmetrics.reporters=prometheus
      - -Dmetrics.reporter.prometheus.port=9249
    environment:
      FLUSS_LOG_DIR: /tmp/fluss-logs
      FLUSS_ENV_JAVA_OPTS: -Xms512m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      READINESS_TCP_HOST: tablet-server-1
      READINESS_TCP_PORT: "9123"
      READINESS_HEALTH_CHECK_TIMEOUT_SECONDS: "180"
    ports:
      - "${TABLET_SERVER_1_PORT:-9125}:9123"
      - "${TABLET_SERVER_1_DEBUG_PORT:-15007}:5005"
      - "${TABLET_SERVER_1_METRICS_PORT:-9251}:9249"

  tablet-server-2:
    <<: *tablet-common
    profiles: [cluster]
    command:
      - -Dzookeeper.address=zookeeper:2181
      - -Dbind.listeners=INTERNAL://tablet-server-2:0,CLIENT://tablet-server-2:9123,DEVKIT://tablet-server-2:19123
      - -Dadvertised.listeners=CLIENT://localhost:${TABLET_SERVER_2_PORT:-9126}
      - -Dinternal.listener.name=INTERNAL
      - -Dtablet-server.id=2
      - -Dkv.snapshot.interval=10s
      - -Ddata.dir=/tmp/fluss/data/tablet-server-2
      - -Dmetrics.reporters=prometheus
      - -Dmetrics.reporter.prometheus.port=9249
    environment:
      FLUSS_LOG_DIR: /tmp/fluss-logs
      FLUSS_ENV_JAVA_OPTS: -Xms512m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      READINESS_TCP_HOST: tablet-server-2
      READINESS_TCP_PORT: "9123"
      READINESS_HEALTH_CHECK_TIMEOUT_SECONDS: "180"
    ports:
      - "${TABLET_SERVER_2_PORT:-9126}:9123"
      - "${TABLET_SERVER_2_DEBUG_PORT:-15008}:5005"
      - "${TABLET_SERVER_2_METRICS_PORT:-9252}:9249"

volumes:
  shared-data:
  zookeeper-data:
  zookeeper-log:
