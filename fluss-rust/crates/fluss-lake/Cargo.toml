[package]
name = "fluss-lake"
version = { workspace = true }
edition = { workspace = true }
# Paimon 0.3 requires Rust 1.91; this package MSRV applies to all features.
# Keep in sync with the `lake-msrv` CI job.
rust-version = "1.91"
license = { workspace = true }
authors = { workspace = true }
description = "Engine-neutral bounded lake and log read kernel for Apache Fluss"
homepage = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[features]
integration_tests = ["fluss/integration_tests"]

[dependencies]
arrow = { workspace = true }
fluss = { package = "fluss-rs", path = "../fluss" }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1.0"

[dev-dependencies]
fluss-test-cluster = { path = "../fluss-test-cluster" }
tokio = { workspace = true }
