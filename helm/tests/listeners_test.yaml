suite: default advertised listeners
templates:
  - templates/sts-coordinator.yaml
  - templates/sts-tablet.yaml
  - templates/svc-coordinator.yaml
  - templates/svc-tablet.yaml
tests:
  - it: advertises in-cluster headless DNS on CLIENT and does not bind EXTERNAL
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'BIND_LISTENERS="INTERNAL://\$\{POD_IP\}:9123, CLIENT://\$\{POD_IP\}:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.tablet-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.coordinator-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124"'
        template: templates/sts-coordinator.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://'
        template: templates/sts-tablet.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://'
        template: templates/sts-coordinator.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: external
        template: templates/sts-tablet.yaml
      - notContains:
          path: spec.ports
          content:
            name: external
        template: templates/svc-tablet.yaml

---

suite: client advertised host override
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
tests:
  - it: overrides CLIENT advertised host and keeps bind on POD_IP
    set:
      listeners.client.advertisedHost: "${POD_NAME}.example.com"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'BIND_LISTENERS="INTERNAL://\$\{POD_IP\}:9123, CLIENT://\$\{POD_IP\}:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.example\.com:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.example\.com:9124"'
        template: templates/sts-coordinator.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://'
        template: templates/sts-tablet.yaml

