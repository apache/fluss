suite: external listener validation
templates:
  - templates/NOTES.txt
tests:
  - it: fails when EXTERNAL is enabled without advertisedHost
    set:
      listeners.external.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.advertisedHost must be set when listeners.external.enabled is true"

  - it: fails when configurationOverrides sets advertised.listeners
    set:
      configurationOverrides:
        advertised.listeners: "CLIENT://example.com:9124"
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nconfigurationOverrides cannot set advertised.listeners; the chart always writes it from listeners.* values"

  - it: fails when configurationOverrides sets bind.listeners
    set:
      configurationOverrides:
        bind.listeners: "INTERNAL://0.0.0.0:9123"
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nconfigurationOverrides cannot set bind.listeners; the chart always writes it from listeners.* values"

  - it: fails when EXTERNAL port collides with CLIENT
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "${POD_NAME}.example.com"
      listeners.external.port: 9124
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.port must differ from listeners.internal.port and listeners.client.port"

  - it: fails when EXTERNAL name is CLIENT
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "${POD_NAME}.example.com"
      listeners.external.name: CLIENT
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.name must not be INTERNAL or CLIENT"

  - it: warns when EXTERNAL advertised address is shared across tablet replicas
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
    asserts:
      - matchRegexRaw:
          pattern: 'VALUES WARNING:'
      - matchRegexRaw:
          pattern: 'listeners.external advertised host/port is the same for every tablet pod'

  - it: does not warn when EXTERNAL advertisedPort includes pod ordinal expansion
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "127.0.0.1"
      tablet.listeners.external.advertisedPort: "$((9126 + ${POD_NAME##*-}))"
    asserts:
      - notMatchRegexRaw:
          pattern: 'listeners.external advertised host/port is the same for every tablet pod'

---

suite: external listener sasl
templates:
  - templates/configmap.yaml
  - templates/configmap-jaas-template.yaml
tests:
  - it: adds EXTERNAL to the protocol map and JAAS when client SASL is enabled
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "${POD_NAME}.example.com"
      security.client.sasl.mechanism: plain
      security.client.sasl.plain.users:
        - username: client-user
          password: client-pass
    asserts:
      - matchRegex:
          path: data["server.yaml"]
          pattern: 'security\.protocol\.map: INTERNAL:PLAINTEXT,CLIENT:SASL,EXTERNAL:SASL'
        template: templates/configmap.yaml
      - matchRegex:
          path: data["jaas.conf"]
          pattern: 'external\.FlussServer\s*\{'
        template: templates/configmap-jaas-template.yaml
