suite: external listener
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
  - templates/svc-tablet.yaml
  - templates/svc-coordinator.yaml
tests:
  - it: binds and advertises EXTERNAL while keeping CLIENT on in-cluster DNS
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "${POD_NAME}.example.com"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'BIND_LISTENERS="INTERNAL://\$\{POD_IP\}:9123, CLIENT://\$\{POD_IP\}:9124, EXTERNAL://\$\{POD_IP\}:9125"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.tablet-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124, EXTERNAL://\$\{POD_NAME\}\.example\.com:9125"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.coordinator-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124, EXTERNAL://\$\{POD_NAME\}\.example\.com:9125"'
        template: templates/sts-coordinator.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: external
            containerPort: 9125
        template: templates/sts-tablet.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: external
            containerPort: 9125
        template: templates/sts-coordinator.yaml
      - contains:
          path: spec.ports
          content:
            name: external
            port: 9125
            targetPort: external
            protocol: TCP
        template: templates/svc-tablet.yaml
      - contains:
          path: spec.ports
          content:
            name: external
            port: 9125
            targetPort: external
            protocol: TCP
        template: templates/svc-coordinator.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        template: templates/sts-tablet.yaml

---

suite: node ip downward api
templates:
  - templates/sts-tablet.yaml
tests:
  - it: does not expose NODE_IP by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
  - it: exposes NODE_IP when an advertised host references it
    set:
      listeners.client.advertisedHost: "${NODE_IP}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
  - it: exposes NODE_IP for shell expansion forms like ${NODE_IP##*.}
    set:
      listeners.client.advertisedHost: "${NODE_IP##*.}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP

---

suite: per-component advertised override
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
tests:
  - it: applies tablet.listeners.external.advertisedPort without changing coordinator
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "127.0.0.1"
      coordinator.listeners.external.advertisedPort: "9125"
      tablet.listeners.external.advertisedPort: "$((9126 + ${POD_NAME##*-}))"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://127\.0\.0\.1:\$\(\(9126 \+ \$\{POD_NAME##\*-\}\)\)'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://127\.0\.0\.1:9125'
        template: templates/sts-coordinator.yaml

