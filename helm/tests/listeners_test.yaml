suite: default advertised listeners
templates:
  - templates/sts-coordinator.yaml
  - templates/sts-tablet.yaml
  - templates/svc-coordinator.yaml
  - templates/svc-tablet.yaml
tests:
  - it: advertises in-cluster headless DNS on CLIENT and does not bind EXTERNAL
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'BIND_LISTENERS="INTERNAL://\$\{POD_IP\}:9123, CLIENT://\$\{POD_IP\}:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.tablet-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.coordinator-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124"'
        template: templates/sts-coordinator.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://'
        template: templates/sts-tablet.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://'
        template: templates/sts-coordinator.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: external
        template: templates/sts-tablet.yaml
      - notContains:
          path: spec.ports
          content:
            name: external
        template: templates/svc-tablet.yaml

---

suite: cluster domain
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
tests:
  - it: uses clusterDomain in the CLIENT advertised FQDN
    set:
      clusterDomain: example.local
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.tablet-server-hs\.\$\{POD_NAMESPACE\}\.svc\.example\.local:9124"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.coordinator-server-hs\.\$\{POD_NAMESPACE\}\.svc\.example\.local:9124"'
        template: templates/sts-coordinator.yaml

---

suite: external listener
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
  - templates/svc-tablet.yaml
  - templates/svc-coordinator.yaml
tests:
  - it: binds and advertises EXTERNAL while keeping CLIENT on in-cluster DNS
    set:
      listeners.external.enabled: true
      coordinator.listeners.external.advertisedHost: coordinator.example.com
      tablet.listeners.external.advertisedHosts:
        - tablet-0.example.com
        - tablet-1.example.com
        - tablet-2.example.com
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'BIND_LISTENERS="INTERNAL://\$\{POD_IP\}:9123, CLIENT://\$\{POD_IP\}:9124, EXTERNAL://\$\{POD_IP\}:9125"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL_ADVERTISED_HOSTS="tablet-0\.example\.com,tablet-1\.example\.com,tablet-2\.example\.com"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.tablet-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124, EXTERNAL://\$EXTERNAL_ADVERTISED_HOST:9125"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.coordinator-server-hs\.\$\{POD_NAMESPACE\}\.svc\.cluster\.local:9124, EXTERNAL://coordinator\.example\.com:9125"'
        template: templates/sts-coordinator.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: external
            containerPort: 9125
        template: templates/sts-tablet.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: external
            containerPort: 9125
        template: templates/sts-coordinator.yaml
      - contains:
          path: spec.ports
          content:
            name: external
            port: 9125
            targetPort: external
            protocol: TCP
        template: templates/svc-tablet.yaml
      - contains:
          path: spec.ports
          content:
            name: external
            port: 9125
            targetPort: external
            protocol: TCP
        template: templates/svc-coordinator.yaml

---

suite: node ip downward api
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
tests:
  - it: always exposes NODE_IP
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
  - it: advertises ${NODE_IP} when advertisedHost is the whitelisted token
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "${NODE_IP}"
      tablet.listeners.external.advertisedPorts: [30001, 30002, 30003]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://\$\{NODE_IP\}:\$EXTERNAL_ADVERTISED_PORT'
        template: templates/sts-tablet.yaml

---

suite: per-component advertised override
templates:
  - templates/sts-tablet.yaml
  - templates/sts-coordinator.yaml
tests:
  - it: applies tablet advertisedPorts without changing coordinator
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "127.0.0.1"
      coordinator.listeners.external.advertisedPort: 9125
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL_ADVERTISED_PORTS="9126,9127,9128"'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://127\.0\.0\.1:\$EXTERNAL_ADVERTISED_PORT'
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'EXTERNAL://127\.0\.0\.1:9125'
        template: templates/sts-coordinator.yaml

