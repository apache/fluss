suite: external listener validation
templates:
  - templates/NOTES.txt
tests:
  - it: fails when EXTERNAL is enabled without advertisedHost
    set:
      listeners.external.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.advertisedHost must be set when listeners.external.enabled is true (or tablet.listeners.external.advertisedHosts / coordinator.listeners.external.advertisedHost)"

  - it: fails when configurationOverrides sets advertised.listeners
    set:
      configurationOverrides:
        advertised.listeners: "CLIENT://example.com:9124"
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nconfigurationOverrides cannot set advertised.listeners; the chart always writes it from listeners.* values"

  - it: fails when configurationOverrides sets bind.listeners
    set:
      configurationOverrides:
        bind.listeners: "INTERNAL://0.0.0.0:9123"
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nconfigurationOverrides cannot set bind.listeners; the chart always writes it from listeners.* values"

  - it: fails when EXTERNAL port collides with CLIENT
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      listeners.external.port: 9124
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.port must differ from listeners.internal.port, listeners.client.port, metrics.prometheus.port, and metrics.jmx.port"

  - it: fails when EXTERNAL port collides with metrics prometheus port
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      listeners.external.port: 9249
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.port must differ from listeners.internal.port, listeners.client.port, metrics.prometheus.port, and metrics.jmx.port"

  - it: fails when advertisedHosts length does not match replica count
    set:
      listeners.external.enabled: true
      coordinator.listeners.external.advertisedHost: coordinator.example.com
      tablet.listeners.external.advertisedHosts:
        - tablet-0.example.com
        - tablet-1.example.com
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\ntablet.listeners.external.advertisedHosts length must equal tablet.numberOfReplicas (3)"

  - it: fails when advertisedHost uses a shell formula
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "${POD_NAME}.example.com"
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.advertisedHost must be a hostname/IP or ${NODE_IP} (shell formulas are not supported)"

  - it: fails when an advertisedHosts entry contains a comma
    set:
      listeners.external.enabled: true
      coordinator.listeners.external.advertisedHost: coordinator.example.com
      tablet.listeners.external.advertisedHosts:
        - "tablet-0.example.com,evil.example.com"
        - tablet-1.example.com
        - tablet-2.example.com
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\ntablet.listeners.external.advertisedHosts[0] must be a hostname/IP or ${NODE_IP} (shell formulas are not supported)"

  - it: fails when advertisedHost and advertisedHosts are both set
    set:
      listeners.external.enabled: true
      coordinator.listeners.external.advertisedHost: coordinator.example.com
      tablet.listeners.external.advertisedHost: tablet.example.com
      tablet.listeners.external.advertisedHosts:
        - tablet-0.example.com
        - tablet-1.example.com
        - tablet-2.example.com
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\ntablet.listeners.external.advertisedHost and advertisedHosts cannot both be set"

  - it: fails when coordinator sets per-ordinal arrays
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      coordinator.listeners.external.advertisedHosts:
        - coordinator.example.com
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\ncoordinator.listeners.external.advertisedHosts is not supported; the coordinator is single-replica, use advertisedHost"

  - it: fails when advertisedPort uses a shell formula
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "127.0.0.1"
      tablet.listeners.external.advertisedPort: "$((9126 + ${POD_NAME##*-}))"
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nlisteners.external.advertisedPort must be an integer (shell formulas are not supported)"

  - it: fails when EXTERNAL mechanism is invalid
    set:
      security.external.sasl.mechanism: bogus
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nsecurity.external.sasl.mechanism must be empty or: plain"

  - it: fails when mechanism is plain but EXTERNAL users are empty
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      security.external.sasl.mechanism: plain
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nsecurity.external.sasl.plain.users must contain at least one user when the matching mechanism is plain"

  - it: warns when EXTERNAL advertised address is shared across tablet replicas
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
    asserts:
      - matchRegexRaw:
          pattern: 'VALUES WARNING:'
      - matchRegexRaw:
          pattern: 'listeners.external advertised host/port is the same for every tablet pod'

  - it: does not warn uniqueness when advertisedPorts are per-ordinal
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "127.0.0.1"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
    asserts:
      - notMatchRegexRaw:
          pattern: 'listeners.external advertised host/port is the same for every tablet pod'

  - it: warns when EXTERNAL is PLAINTEXT
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
    asserts:
      - matchRegexRaw:
          pattern: 'unauthenticated listener is exposed outside the cluster'

  - it: warns when external sasl is set while EXTERNAL is disabled
    set:
      security.external.sasl.mechanism: plain
      security.external.sasl.plain.users:
        - username: ext-user
          password: ext-pass
    asserts:
      - matchRegexRaw:
          pattern: 'security.external.sasl is set but listeners.external.enabled is false'

  - it: does not warn ignored external sasl when EXTERNAL is enabled
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      security.external.sasl.mechanism: plain
      security.external.sasl.plain.users:
        - username: ext-user
          password: ext-pass
    asserts:
      - notMatchRegexRaw:
          pattern: 'security.external.sasl is set but listeners.external.enabled is false'

---

suite: external listener sasl
templates:
  - templates/configmap.yaml
  - templates/configmap-jaas-template.yaml
tests:
  - it: does not inherit CLIENT SASL onto EXTERNAL
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      security.client.sasl.mechanism: plain
      security.client.sasl.plain.users:
        - username: client-user
          password: client-pass
    asserts:
      - matchRegex:
          path: data["server.yaml"]
          pattern: 'security\.protocol\.map: INTERNAL:PLAINTEXT,CLIENT:SASL,EXTERNAL:PLAINTEXT'
        template: templates/configmap.yaml
      - notMatchRegex:
          path: data["jaas.conf"]
          pattern: 'external\.FlussServer'
        template: templates/configmap-jaas-template.yaml

  - it: shares credentials across CLIENT and EXTERNAL via the same existingSecret
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      security.client.sasl.mechanism: plain
      security.client.sasl.plain.users:
        - existingSecret:
            name: fluss-sasl-alice
      security.external.sasl.mechanism: plain
      security.external.sasl.plain.users:
        - existingSecret:
            name: fluss-sasl-alice
    asserts:
      - matchRegex:
          path: data["server.yaml"]
          pattern: 'security\.protocol\.map: INTERNAL:PLAINTEXT,CLIENT:SASL,EXTERNAL:SASL'
        template: templates/configmap.yaml
      - matchRegex:
          path: data["jaas.conf"]
          pattern: 'user_\$\{FLUSS_JAAS_CLIENT_USERNAME_0\}'
        template: templates/configmap-jaas-template.yaml
      - matchRegex:
          path: data["jaas.conf"]
          pattern: 'user_\$\{FLUSS_JAAS_EXTERNAL_USERNAME_0\}'
        template: templates/configmap-jaas-template.yaml

  - it: uses dedicated EXTERNAL users when mechanism is plain
    set:
      listeners.external.enabled: true
      listeners.external.advertisedHost: "fluss.example.com"
      tablet.listeners.external.advertisedPorts: [9126, 9127, 9128]
      security.external.sasl.mechanism: plain
      security.external.sasl.plain.users:
        - username: ext-user
          password: ext-pass
    asserts:
      - matchRegex:
          path: data["server.yaml"]
          pattern: 'security\.protocol\.map: INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT,EXTERNAL:SASL'
        template: templates/configmap.yaml
      - matchRegex:
          path: data["jaas.conf"]
          pattern: 'user_\$\{FLUSS_JAAS_EXTERNAL_USERNAME_0\}'
        template: templates/configmap-jaas-template.yaml
