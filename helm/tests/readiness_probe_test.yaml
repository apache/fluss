suite: readiness probes
templates:
  - templates/sts-coordinator.yaml
  - templates/sts-tablet.yaml
tests:
  - it: coordinator readiness is an exec probe in the coordinator role by default
    template: templates/sts-coordinator.yaml
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].readinessProbe.exec
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 360
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_ROLE=coordinator"
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_TCP_PORT=9124"
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_HEALTH_CHECK_AUTH"
  - it: coordinator liveness stays a TCP probe
    template: templates/sts-coordinator.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 9124
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe.exec
  - it: coordinator readiness knobs are overridable
    template: templates/sts-coordinator.yaml
    set:
      coordinator:
        readinessProbe:
          failureThreshold: 42
          timeoutSeconds: 3
          initialDelaySeconds: 7
          periodSeconds: 11
          rpcTimeoutMs: 2500
          healthCheckTimeoutSeconds: 300
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 42
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 11
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_TIMEOUT_MS=2500"
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_HEALTH_CHECK_TIMEOUT_SECONDS=300"
  - it: coordinator readiness passes healthCheckAuth through when set
    template: templates/sts-coordinator.yaml
    set:
      coordinator:
        readinessProbe:
          healthCheckAuth: "client.security.protocol:SASL;client.sasl.mechanism:PLAIN"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_HEALTH_CHECK_AUTH=\"client.security.protocol:SASL;client.sasl.mechanism:PLAIN\""
  - it: tablet readiness keeps its defaults and does not set a role
    template: templates/sts-tablet.yaml
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].readinessProbe.exec
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 360
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "READINESS_ROLE"
