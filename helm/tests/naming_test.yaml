suite: fixed-names-by-default
templates:
  - templates/configmap.yaml
  - templates/sts-coordinator.yaml
  - templates/sts-tablet.yaml
  - templates/svc-coordinator.yaml
  - templates/svc-tablet.yaml
  - templates/pdb-coordinator.yaml
  - templates/pdb-tablet.yaml
  - templates/svc-metrics-coordinator.yaml
  - templates/svc-metrics-tablet.yaml
release:
  name: alpha
set:
  coordinator.podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  tablet.podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  metrics.reporters: prometheus
  metrics.prometheus:
    port: 9249

tests:
  - it: should keep the fixed resource names when the option is off
    asserts:
      - equal:
          path: metadata.name
          value: fluss-conf-file
        template: templates/configmap.yaml
      - equal:
          path: metadata.name
          value: coordinator-server
        template: templates/sts-coordinator.yaml
      - equal:
          path: metadata.name
          value: tablet-server
        template: templates/sts-tablet.yaml
      - equal:
          path: metadata.name
          value: coordinator-server-hs
        template: templates/svc-coordinator.yaml
      - equal:
          path: metadata.name
          value: tablet-server-hs
        template: templates/svc-tablet.yaml
      - equal:
          path: metadata.name
          value: coordinator-server
        template: templates/pdb-coordinator.yaml
      - equal:
          path: metadata.name
          value: tablet-server
        template: templates/pdb-tablet.yaml
      - equal:
          path: metadata.name
          value: alpha-coordinator-server-metrics-hs
        template: templates/svc-metrics-coordinator.yaml
      - equal:
          path: metadata.name
          value: alpha-tablet-server-metrics-hs
        template: templates/svc-metrics-tablet.yaml

  - it: should keep the fixed cross references when the option is off
    asserts:
      - equal:
          path: spec.serviceName
          value: coordinator-server-hs
        template: templates/sts-coordinator.yaml
      - equal:
          path: spec.serviceName
          value: tablet-server-hs
        template: templates/sts-tablet.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: fluss-conf
            configMap:
              name: fluss-conf-file
        template: templates/sts-tablet.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.coordinator-server-hs\.'
        template: templates/sts-coordinator.yaml

---

suite: release-scoped-names
templates:
  - templates/configmap.yaml
  - templates/sts-coordinator.yaml
  - templates/sts-tablet.yaml
  - templates/svc-coordinator.yaml
  - templates/svc-tablet.yaml
  - templates/pdb-coordinator.yaml
  - templates/pdb-tablet.yaml
  - templates/svc-metrics-coordinator.yaml
  - templates/svc-metrics-tablet.yaml
release:
  name: alpha
set:
  releaseScopedResourceNames: true
  coordinator.podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  tablet.podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  metrics.reporters: prometheus
  metrics.prometheus:
    port: 9249

tests:
  - it: should prefix every resource name with the release name
    asserts:
      - equal:
          path: metadata.name
          value: alpha-fluss-conf-file
        template: templates/configmap.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-coordinator-server
        template: templates/sts-coordinator.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-tablet-server
        template: templates/sts-tablet.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-coordinator-server-hs
        template: templates/svc-coordinator.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-tablet-server-hs
        template: templates/svc-tablet.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-coordinator-server
        template: templates/pdb-coordinator.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-tablet-server
        template: templates/pdb-tablet.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-coordinator-server-metrics-hs
        template: templates/svc-metrics-coordinator.yaml
      - equal:
          path: metadata.name
          value: alpha-fluss-tablet-server-metrics-hs
        template: templates/svc-metrics-tablet.yaml

  - it: should point the StatefulSets at the release-scoped headless Services
    asserts:
      - equal:
          path: spec.serviceName
          value: alpha-fluss-coordinator-server-hs
        template: templates/sts-coordinator.yaml
      - equal:
          path: spec.serviceName
          value: alpha-fluss-tablet-server-hs
        template: templates/sts-tablet.yaml

  - it: should mount the release-scoped ConfigMap
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: fluss-conf
            configMap:
              name: alpha-fluss-conf-file
        template: templates/sts-coordinator.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: fluss-conf
            configMap:
              name: alpha-fluss-conf-file
        template: templates/sts-tablet.yaml

  - it: should advertise the release-scoped Service FQDN
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.alpha-fluss-coordinator-server-hs\.'
        template: templates/sts-coordinator.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'ADVERTISED_LISTENERS="CLIENT://\$\{POD_NAME\}\.alpha-fluss-tablet-server-hs\.'
        template: templates/sts-tablet.yaml

---

suite: zookeeper-root-path
templates:
  - templates/configmap.yaml
release:
  name: alpha

tests:
  - it: should keep the shared ZooKeeper root path by default
    asserts:
      - matchRegex:
          path: data["server.yaml"]
          pattern: 'zookeeper\.path\.root: /fluss\n'

  - it: should scope the ZooKeeper root path to the release when opted in
    set:
      releaseScopedResourceNames: true
    asserts:
      - matchRegex:
          path: data["server.yaml"]
          pattern: 'zookeeper\.path\.root: /fluss/alpha'

---

suite: name-length-validation
templates:
  - templates/NOTES.txt

tests:
  - it: should fail when the release name makes generated names too long
    release:
      name: a-very-long-fluss-release-name-that-will-not-fit
    set:
      releaseScopedResourceNames: true
    asserts:
      - failedTemplate:
          errorPattern: "must stay within 63 characters"

  - it: should accept a release name that fits
    release:
      name: alpha
    set:
      releaseScopedResourceNames: true
    asserts:
      - notFailedTemplate: {}

  - it: should not apply the length check with fixed names
    release:
      name: a-very-long-fluss-release-name-that-will-not-fit
    asserts:
      - notFailedTemplate: {}
