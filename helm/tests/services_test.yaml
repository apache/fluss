suite: headless-services
templates:
  - templates/svc-coordinator.yaml
  - templates/svc-tablet.yaml
tests:
  - it: publishes not-ready addresses by default
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: disables not-ready addresses on the coordinator service only
    set:
      coordinator.service.publishNotReadyAddresses: false
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: false
        template: templates/svc-coordinator.yaml
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
        template: templates/svc-tablet.yaml

  - it: disables not-ready addresses on the tablet service only
    set:
      tablet.service.publishNotReadyAddresses: false
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
        template: templates/svc-coordinator.yaml
      - equal:
          path: spec.publishNotReadyAddresses
          value: false
        template: templates/svc-tablet.yaml
