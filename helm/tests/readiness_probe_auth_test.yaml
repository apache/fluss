suite: readiness-probe-auth
templates:
  - templates/sts-coordinator.yaml
  - templates/sts-tablet.yaml
  - templates/NOTES.txt
tests:
  - it: renders no probe credential by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: READINESS_HEALTH_CHECK_AUTH
          any: true
        template: templates/sts-tablet.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 'READINESS_HEALTH_CHECK_AUTH'
        template: templates/sts-tablet.yaml

  - it: sources the probe credential from a Secret on every server container
    set:
      security.readinessProbe.existingSecret:
        name: fluss-readiness-probe-auth
        key: auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: READINESS_HEALTH_CHECK_AUTH
            valueFrom:
              secretKeyRef:
                name: fluss-readiness-probe-auth
                key: auth
        template: templates/sts-tablet.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: READINESS_HEALTH_CHECK_AUTH
            valueFrom:
              secretKeyRef:
                name: fluss-readiness-probe-auth
                key: auth
        template: templates/sts-coordinator.yaml
      # The probe command must not export the variable, otherwise it would
      # override the Secret-sourced value inherited from the container.
      - notMatchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 'export READINESS_HEALTH_CHECK_AUTH'
        template: templates/sts-tablet.yaml

  - it: defaults the Secret key to auth
    set:
      security.readinessProbe.existingSecret.name: fluss-readiness-probe-auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: READINESS_HEALTH_CHECK_AUTH
            valueFrom:
              secretKeyRef:
                name: fluss-readiness-probe-auth
                key: auth
        template: templates/sts-tablet.yaml

  - it: fails when the credential is set both inline and via existingSecret
    set:
      tablet.readinessProbe.healthCheckAuth: "client.security.protocol:SASL"
      security.readinessProbe.existingSecret.name: fluss-readiness-probe-auth
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nthe readiness probe credential is set more than once (tablet.readinessProbe.healthCheckAuth, security.readinessProbe.existingSecret); set only one"
        template: templates/NOTES.txt

  - it: fails when the credential is set both via existingSecret and secrets.env
    set:
      security.readinessProbe.existingSecret.name: fluss-readiness-probe-auth
      secrets.env:
        - name: READINESS_HEALTH_CHECK_AUTH
          secretName: fluss-readiness-probe-auth
          key: auth
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nthe readiness probe credential is set more than once (security.readinessProbe.existingSecret, the secrets.env entry named READINESS_HEALTH_CHECK_AUTH); set only one"
        template: templates/NOTES.txt

  - it: fails when the credential is set both inline and via secrets.env
    set:
      tablet.readinessProbe.healthCheckAuth: "client.security.protocol:SASL"
      secrets.env:
        - name: READINESS_HEALTH_CHECK_AUTH
          secretName: fluss-readiness-probe-auth
          key: auth
    asserts:
      - failedTemplate:
          errorMessage: "VALUES VALIDATION:\nthe readiness probe credential is set more than once (tablet.readinessProbe.healthCheckAuth, the secrets.env entry named READINESS_HEALTH_CHECK_AUTH); set only one"
        template: templates/NOTES.txt
