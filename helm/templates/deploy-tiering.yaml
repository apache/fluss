{{- if .Values.embeddedTiering.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fluss.tiering.name" . }}
  labels:
  {{- include "fluss.labels" . | nindent 4 }}
  {{- with .Values.embeddedTiering.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.embeddedTiering.numberOfReplicas }}
  selector:
    matchLabels:
      {{- include "fluss.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tiering
  template:
    metadata:
      labels:
        {{- with .Values.embeddedTiering.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "fluss.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tiering
      annotations:
        checksum/tiering-config: {{ include (print $.Template.BasePath "/configmap-tiering.yaml") . | sha256sum }}
        {{- with omit .Values.embeddedTiering.podAnnotations "checksum/tiering-config" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "fluss.fullname" .) }}
      {{- end }}
      {{- include "fluss.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.embeddedTiering.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddedTiering.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddedTiering.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.embeddedTiering.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The tiering job is stateless (progress persists in Fluss lake snapshots), so this only
      # needs to cover a clean shutdown of the embedded Flink runtime on SIGTERM.
      terminationGracePeriodSeconds: {{ .Values.embeddedTiering.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}-tiering
          image: {{ include "fluss.embeddedTiering.image" . }}
          imagePullPolicy: {{ .Values.embeddedTiering.image.pullPolicy }}
          {{- if or (include "fluss.secrets.enabled" .) .Values.embeddedTiering.extraEnv }}
          env:
            {{- if (include "fluss.secrets.enabled" .) }}
            {{- include "fluss.secrets.env" . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.embeddedTiering.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.embeddedTiering.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No liveness or readiness probes: the embedded Flink runtime exposes no HTTP endpoint
          # by default, and the stateless service is restarted by the container supervisor on
          # non-zero exit instead.
          resources:
            {{- toYaml .Values.resources.tieringService | nindent 12 }}
          volumeMounts:
            - name: tiering-conf
              mountPath: /opt/fluss/conf
            {{- if (include "fluss.secrets.enabled" .) }}
            {{- include "fluss.secrets.volumeMounts" . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.embeddedTiering.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tiering-conf
          configMap:
            name: {{ include "fluss.tiering.configMapName" . }}
        {{- if (include "fluss.secrets.enabled" .) }}
        {{- include "fluss.secrets.volumes" . | trim | nindent 8 }}
        {{- end }}
        {{- with .Values.embeddedTiering.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
