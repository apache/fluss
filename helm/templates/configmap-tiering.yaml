{{- if .Values.tiering.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fluss.tiering.configMapName" . }}
  labels:
  {{- include "fluss.labels" . | nindent 4 }}
data:
  tiering.yaml: |
    {{- range $key, $val := .Values.tiering.configurationOverrides }}
    {{ $key }}: {{ tpl (printf "%v" $val) $ }}
    {{- end }}

    {{- if not (hasKey .Values.tiering.configurationOverrides "fluss.bootstrap.servers") }}
    fluss.bootstrap.servers: {{ include "fluss.tiering.defaultBootstrapServers" . }}
    {{- end }}

    {{- if include "fluss.secrets.enabled" . }}
    {{- include "fluss.secrets.configLines" . | nindent 4 }}
    {{- end }}
{{- end }}
