replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  registry: ""
  repository: apache/fluss-gateway
  # Defaults to Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  # pullSecrets: [my-registry-secret]

# Use Fluss client listeners reachable from Gateway pods.
clusters:
  default:
    bootstrapServers: coordinator-server-hs:9124
    securityProtocol: plaintext
    sasl:
      # Required for securityProtocol: sasl; the Secret must be in this namespace.
      existingSecret: {}
      # existingSecret:
      #   name: fluss-gateway-backend
      #   usernameKey: username
      #   passwordKey: password

server:
  restPort: 8080
  requestTimeout: 30s
  shutdownDrainTimeoutSeconds: 30

# Must exceed server.shutdownDrainTimeoutSeconds + 5 (preStop delay).
terminationGracePeriodSeconds: 45

service:
  type: ClusterIP
  port: 8080
  annotations: {}

metrics:
  enabled: true
  port: 9095
  service:
    labels: {}
    annotations: {}

# Additional flat Gateway options; chart-managed settings cannot be overridden.
# Supply credentials through existing Secrets.
configurationOverrides: {}

resources: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
