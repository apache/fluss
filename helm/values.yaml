# Default values for fluss.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: ""
  repository: apache/fluss
  tag: "1.1.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Gives every resource a name unique to this release, and scopes the ZooKeeper
# root path to the namespace and release, so several Fluss clusters can share
# a namespace.
# Off by default, an existing release must opt in deliberately.
uniqueResourceNames: false

# Fluss server configuration options
configurationOverrides:
  default.bucket.number: 3
  default.replication.factor: 3
  # Follows uniqueResourceNames. The scoped root carries the namespace as well
  # as the release, since release names are only unique within a namespace, in
  # separate path segments so the two cannot run together. It is a sibling of
  # /fluss rather than a child, because a release still on /fluss uses that as
  # its ZooKeeper namespace and would contain it.
  zookeeper.path.root: /fluss{{ if .Values.uniqueResourceNames }}-{{ .Release.Namespace }}/{{ .Release.Name }}{{ end }}
  zookeeper.address: zk-zookeeper.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:2181
  remote.data.dir: /tmp/fluss/remote-data
  data.dir: /tmp/fluss/data
  internal.listener.name: INTERNAL

tablet:
  numberOfReplicas: 3
  storage:
    enabled: false
    size: 1Gi
    storageClass:
  # Readiness probe configuration for rolling upgrade gate.
  # The probe talks to the LOCAL tablet server (127.0.0.1:client-port) and
  # asks it to forward a getClusterHealth RPC to the Coordinator over the
  # internal listener. Pod is marked Ready only when the cluster is GREEN.
  # If the server does not support the API (older version), the probe
  # immediately falls back to TCP-only port readiness.
  readinessProbe:
    # Timeout in ms for the RPC call.
    rpcTimeoutMs: 5000
    # Standard Kubernetes probe parameters (tuned for recovery checks).
    #
    # The total time Kubernetes will wait before flipping the pod to NotReady is
    #     initialDelaySeconds + failureThreshold * periodSeconds
    #   = 15 + 360 * 5 = 1815s (~30 minutes) by default.
    # IMPORTANT: this window MUST be larger than healthCheckTimeoutSeconds
    # below, otherwise Kubernetes will mark the pod NotReady BEFORE the
    # in-script health-check fallback has a chance to latch the TCP fast path,
    # which would still wedge the rolling upgrade. If you tune
    # healthCheckTimeoutSeconds upward, raise failureThreshold accordingly so
    # the inequality (failureThreshold * periodSeconds > healthCheckTimeoutSeconds)
    # always holds.
    failureThreshold: 360
    timeoutSeconds: 10
    initialDelaySeconds: 15
    periodSeconds: 5
    # Maximum wall-clock seconds the cluster health gate is allowed to keep a
    # freshly-created tablet pod NotReady on its first boot. After this budget
    # is exhausted the probe latches the TCP-only fast path so a permanently-
    # unrecoverable cluster cannot wedge a rolling upgrade indefinitely.
    # Default: 1200 (20 minutes).
    healthCheckTimeoutSeconds: 1200
    # Optional client auth configuration passed to the probe's RpcClient as a
    # single-line string of semicolon-separated `key:value` pairs (no quoting
    # or escaping needed). Required when security.client.sasl.mechanism is
    # set; the chart fails to render without it, unless the probe gets the
    # value as a READINESS_HEALTH_CHECK_AUTH env var from a Secret through
    # secrets.env (both components) or extraEnv. Example:
    #   healthCheckAuth: "client.security.protocol:SASL;client.sasl.mechanism:PLAIN;client.security.sasl.username:admin;client.security.sasl.password:admin-pass"
    #
    # This value is inlined into the StatefulSet's probe command, so it is
    # readable by anyone who can read the rendered manifest. To keep the
    # credential in a Secret instead, leave this empty and set
    # `security.readinessProbe.existingSecret`.
    # Setting both is rejected at render time, because the probe command
    # would silently override the Secret.
    healthCheckAuth: ""
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  extraEnv: []
  envFrom: []
  # Optional EXTERNAL advertised host/port overrides for tablets only.
  # advertisedHosts / advertisedPorts are per-ordinal; length must equal numberOfReplicas.
  listeners:
    external:
      advertisedHost: ""
      advertisedHosts: []
      advertisedPort: ""
      advertisedPorts: []
  annotations: {}
  service:
    annotations: {}
    publishNotReadyAddresses: true
  podAnnotations: {}
  podLabels: {}
  podDisruptionBudget:
    enabled: false
    # minAvailable: 1
    # maxUnavailable: 1
  # Pod scheduling configuration
  affinity: {}
  # Example: spread tablet server pods across availability zones and nodes.
  # Replace `<release-name>` below with your Helm release name (the value
  # passed to `helm install <release-name>`) before uncommenting.
  # affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           topologyKey: topology.kubernetes.io/zone
  #           labelSelector:
  #             matchLabels:
  #               app.kubernetes.io/instance: <release-name>
  #               app.kubernetes.io/component: tablet
  #       - weight: 50
  #         podAffinityTerm:
  #           topologyKey: kubernetes.io/hostname
  #           labelSelector:
  #             matchLabels:
  #               app.kubernetes.io/instance: <release-name>
  #               app.kubernetes.io/component: tablet
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []

coordinator:
  # The default stays 1. Running more than one replica gives you warm standbys
  # that take over via leader election on coordinator failure.
  numberOfReplicas: 1
  storage:
    enabled: false
    size: 1Gi
    storageClass:
  # Readiness probe configuration. The probe talks to the LOCAL coordinator
  # (POD_IP:client-port) for cluster health, which tells it the role:
  #   - the leader answers and is Ready regardless of cluster status color.
  #   - a standby rejects the request, and becomes Ready once the leader
  #     lists it among the standby coordinators.
  # The check runs only until it first passes or healthCheckTimeoutSeconds
  # runs out; after that the probe only checks the TCP port.
  readinessProbe:
    rpcTimeoutMs: 5000
    failureThreshold: 360
    timeoutSeconds: 10
    initialDelaySeconds: 15
    periodSeconds: 5
    # Maximum wall-clock seconds the role check is allowed to keep a
    # freshly-created coordinator pod NotReady on its first boot. After this
    # budget is exhausted the probe latches the TCP-only fast path so a
    # missing leader cannot hang a rolling upgrade indefinitely.
    # Default: 1200 (20 minutes).
    healthCheckTimeoutSeconds: 1200
    # Optional client auth configuration passed to the probe's RpcClient as a
    # single-line string of semicolon-separated `key:value` pairs (no quoting
    # or escaping needed). Required when security.client.sasl.mechanism is
    # set; the chart fails to render without it, unless the probe gets the
    # value as a READINESS_HEALTH_CHECK_AUTH env var from a Secret through
    # secrets.env (both components) or extraEnv. Example:
    #   healthCheckAuth: "client.security.protocol:SASL;client.sasl.mechanism:PLAIN;client.security.sasl.username:admin;client.security.sasl.password:admin-pass"
    healthCheckAuth: ""
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  extraEnv: []
  envFrom: []
  # Optional EXTERNAL advertised host/port overrides for the coordinator.
  # EXTERNAL with numberOfReplicas > 1 fails the render: per-ordinal
  # coordinator addresses are not supported yet.
  listeners:
    external:
      advertisedHost: ""
      advertisedPort: ""
  annotations: {}
  service:
    annotations: {}
    publishNotReadyAddresses: true
  podAnnotations: {}
  podLabels: {}
  podDisruptionBudget:
    enabled: false
    # minAvailable: 1
    # maxUnavailable: 1
  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []

# Kubernetes cluster domain for chart-owned in-cluster DNS (CLIENT advertised FQDN).
clusterDomain: cluster.local

listeners:
  internal:
    port: 9123
  client:
    port: 9124
  external:
    # Opt-in second client listener so in-cluster CLIENT advertised addresses
    # stay on cluster DNS while external clients bootstrap on EXTERNAL.
    enabled: false
    port: 9125
    advertisedHost: ""
    advertisedPort: ""

# Secrets referenced from configurationOverrides via config provider markers:
# mounts are read with ${directory:<basePath>/<name>:<key>}, env entries with
# ${env:<NAME>}. The chart generates the matching config.providers lines.
secrets:
  basePath: /etc/fluss/secrets
  # - name: paimon-creds
  #   secretName: fluss-paimon-creds
  mounts: []
  # - name: PAIMON_S3_ACCESS_KEY
  #   secretName: fluss-paimon-creds
  #   key: access-key
  env: []

# Fluss security configurations
security:
  client:
    sasl:
      # "" | plain
      mechanism: ""
      plain:
        # Each entry is either a literal {username, password} pair or an
        # `existingSecret` reference that sources both from a Secret (same shape
        # as internal/zookeeper). Mixing within one entry is not allowed.
        users: []
        # - username: alice
        #   password: alice-pass
        # - existingSecret:
        #     name: fluss-client-sasl-bob
        #     usernameKey: username
        #     passwordKey: password

  external:
    sasl:
      # "" (PLAINTEXT + warning when listeners.external.enabled) | plain
      mechanism: ""
      plain:
        users: []
        # To share credentials with CLIENT, point both listeners' users at the
        # same existingSecret.
        # - username: external-user
        #   password: external-pass
        # - existingSecret:
        #     name: fluss-external-sasl
        #     usernameKey: username
        #     passwordKey: password

  internal:
    sasl:
      # "" | plain
      mechanism: ""
      plain:
        username: ""
        password: ""
        # When set, overrides literal username/password above.
        existingSecret: {}
        # existingSecret:
        #   name: fluss-internal-sasl
        #   usernameKey: username
        #   passwordKey: password

  # Credential for the cluster-health readiness probes, sourced from a Secret.
  # The referenced key holds the same single-line string that
  # `<component>.readinessProbe.healthCheckAuth` takes as a literal; the chart
  # renders it as the READINESS_HEALTH_CHECK_AUTH environment variable on every
  # server container, so the exec probe picks it up unchanged and the credential
  # never appears in the rendered manifest. It lives here rather than under a
  # component because every component's probe authenticates with it.
  readinessProbe:
    existingSecret: {}
    # existingSecret:
    #   name: fluss-readiness-probe-auth
    #   key: auth

  zookeeper:
    sasl:
      # "" | plain
      mechanism: ""
      plain:
        username: ""
        password: ""
        loginModuleClass: "org.apache.fluss.shaded.zookeeper3.org.apache.zookeeper.server.auth.DigestLoginModule"
        # When set, overrides literal username/password above.
        existingSecret: {}
        # existingSecret:
        #   name: fluss-zk-sasl
        #   usernameKey: username
        #   passwordKey: password

  # JAAS config is rendered at pod startup by an init container that reads a
  # template ConfigMap and substitutes credentials from env. The init container
  # reuses the main Fluss image (already available on the node).

metrics:
  reporters: ""
  prometheus:
    port: 9249
    service:
      portName: metrics
      labels: {}
      annotations: {}
  jmx:
    port: 9250

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # coordinatorServer:
  #   limits:
  #     cpu: 100m
  #     memory: 128Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  # tabletServer:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 100m
  #     memory: 128Mi

serviceAccount:
  create: false
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Additional annotations to apply to the ServiceAccount.
  # These can be useful, for example, to support integrations like workload identity.
  annotations: {}
